name: Eczacı Haber Portalı - Kaynak Tanılama

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eczaci-haber-portali
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: eczaci-haber-portali/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Kaynakları tanıla
        run: node scripts/diagnose.mjs

      - name: Tanılama çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: eczaci-haber-portali/diagnostics/
          retention-days: 7
